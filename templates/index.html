<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minija River Flood Prediction</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f2f5; color: #333; text-align: center; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); max-width: 650px; width: 90%; }
        h1 { color: #1a237e; margin-bottom: 20px; }
        .results-container { display: flex; justify-content: space-around; gap: 20px; margin: 30px 0; }
        .prediction-box { flex: 1; padding: 20px; border-radius: 8px; }
        .current-box { background-color: #e8f5e9; border: 2px solid #a5d6a7; }
        .future-box { background-color: #e3f2fd; border: 2px solid #90caf9; }
        .prediction-value { font-size: 2.5em; font-weight: bold; }
        .current-value { color: #2e7d32; }
        .future-value { color: #0d47a1; }
        .prediction-label { font-size: 1.1em; color: #555; margin-bottom: 10px; }
        .button { display: inline-block; background-color: #1976d2; color: white; padding: 15px 30px; text-decoration: none; border-radius: 8px; font-size: 1.2em; font-weight: 500; transition: background-color 0.3s, transform 0.2s; border: none; cursor: pointer; }
        .button:hover { background-color: #1565c0; transform: translateY(-2px); }
        .footer { margin-top: 30px; font-size: 0.9em; color: #777; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Minija River Flood Prediction</h1>
        <a href="/predict" class="button">Get Latest Prediction</a>
        <div class="results-container">
            <div class="prediction-box current-box">
                <p class="prediction-label">Latest Water Level (Today):</p>
                <p class="prediction-value current-value">{{ current_level_result }}</p>
            </div>
            <div class="prediction-box future-box">
                <p class="prediction-label">Prediction for Tomorrow:</p>
                <p class="prediction-value future-value">{{ prediction_result }}</p>
            </div>
        </div>
        <div class="footer">
            Prediction for: {{ prediction_date }}
        </div>
    </div>
</body>
</html>
