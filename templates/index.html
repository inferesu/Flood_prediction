<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live River Flood Risk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lato', sans-serif; }
        .card { background-color: #1E293B; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; }
        .risk-low { background-color: #059669; color: white; }
        .risk-moderate { background-color: #D97706; color: white; }
        .risk-high { background-color: #DC2626; color: white; }
        .risk-severe { background-color: #7E22CE; color: white; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        select.river-select { background-color: #334155; color: #E2E8F0; border: 1px solid #475569; border-radius: 0.5rem; padding: 0.5rem 1rem; font-weight: 600; }
    </style>
</head>
<body class="bg-slate-900 text-gray-200">

    <div class="container mx-auto p-4 md:p-8 max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white">River Flood Risk</h1>
            <p class="text-slate-400 mt-2">Real-time Hydrological Forecast</p>
            <div class="mt-6">
                <select id="river-select" class="river-select">
                    <option value="minija">Minija (Priekulė)</option>
                </select>
            </div>
        </header>

        <main class="grid grid-cols-1 gap-6">
            <!-- Risk Card -->
            <div id="risk-card" class="card text-center flex flex-col items-center justify-center p-6 bg-slate-800">
                <h2 class="text-lg font-semibold text-slate-300 uppercase tracking-wider">Forecast Risk Level</h2>
                <p id="risk-level" class="text-5xl font-bold mt-2">--</p>
            </div>

            <!-- AI Report -->
            <div class="card border-l-4 border-purple-500 bg-slate-800/50">
                <div class="flex items-start gap-4">
                    <div class="p-3 bg-purple-900/30 rounded-lg text-purple-400 shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z"/></svg>
                    </div>
                    <div>
                        <h3 class="text-lg font-bold text-white mb-1">AI Hydrology Analyst</h3>
                        <p id="ai-report-text" class="text-slate-300 text-base leading-relaxed">
                            Loading forecast data...
                        </p>
                    </div>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="card flex items-center justify-between">
                    <div>
                        <h3 class="font-semibold text-slate-300">Current Water Level</h3>
                        <p id="current-level" class="text-4xl font-bold text-white mt-2">-- cm</p>
                    </div>
                    <div class="text-blue-400">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg>
                    </div>
                </div>
                <div class="card flex items-center justify-between">
                    <div>
                        <h3 class="font-semibold text-slate-300">Tomorrow's Forecast</h3>
                        <p id="predicted-level" class="text-4xl font-bold text-white mt-2">-- cm</p>
                    </div>
                    <div class="text-purple-400">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                    </div>
                </div>
            </div>

            <!-- Live Model Inputs Grid -->
            <div class="card">
                <h3 class="font-semibold text-slate-300 mb-4 border-b border-slate-700 pb-2">Live Model Inputs</h3>
                <div id="features-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    <div class="text-center p-2"><span class="text-slate-500">Loading inputs...</span></div>
                </div>
            </div>

            <!-- Chart -->
            <div class="card">
                <h3 class="font-semibold text-slate-300 mb-4">Historical & Predicted Water Levels</h3>
                <div class="h-64 md:h-80"><canvas id="forecast-chart"></canvas></div>
            </div>

            <!-- Footer -->
            <div class="text-center mt-4">
                <p class="text-sm text-slate-500 mb-4">Last updated: <span id="last-updated">Never</span></p>
            </div>
        </main>
    </div>

    <script>
        const ui = {
            riverSelect: document.getElementById('river-select'),
            riskCard: document.getElementById('risk-card'),
            riskLevel: document.getElementById('risk-level'),
            currentLevel: document.getElementById('current-level'),
            predictedLevel: document.getElementById('predicted-level'),
            aiReportText: document.getElementById('ai-report-text'),
            lastUpdated: document.getElementById('last-updated'),
            chartCanvas: document.getElementById('forecast-chart'),
            featuresGrid: document.getElementById('features-grid')
        };

        let forecastChart = null;

        const RISK_THRESHOLDS = { MODERATE: 250, HIGH: 400, SEVERE: 550 };
        const riskClasses = { LOW: 'risk-low', MODERATE: 'risk-moderate', HIGH: 'risk-high', SEVERE: 'risk-severe' };

        async function fetchRiverData() {
            const river = ui.riverSelect.value;
            ui.aiReportText.innerText = "Fetching latest data...";

            try {
                const res = await fetch(`/api/data?river=${river}`);
                if (!res.ok) throw new Error(`Server Error: ${res.status}`);

                const data = await res.json();
                if (data.error) {
                    ui.aiReportText.innerText = data.error;
                    return;
                }
                updateUI(data);
            } catch (e) {
                console.error(e);
                ui.aiReportText.innerText = "Connection failed. Ensure backend is running.";
            }
        }

        function updateUI(data) {
            ui.currentLevel.textContent = data.lastKnownLevel ? `${data.lastKnownLevel} cm` : "--";
            ui.predictedLevel.textContent = data.predictedNextDayLevel ? `${data.predictedNextDayLevel} cm` : "--";
            ui.aiReportText.textContent = data.aiReport || "No report available.";
            ui.lastUpdated.textContent = new Date(data.lastUpdated).toLocaleString();

            const pred = parseFloat(data.predictedNextDayLevel || 0);
            let level = 'LOW';
            if (pred >= RISK_THRESHOLDS.SEVERE) level = 'SEVERE';
            else if (pred >= RISK_THRESHOLDS.HIGH) level = 'HIGH';
            else if (pred >= RISK_THRESHOLDS.MODERATE) level = 'MODERATE';

            ui.riskCard.className = `card text-center flex flex-col items-center justify-center p-6 ${riskClasses[level]}`;
            ui.riskLevel.textContent = level;

            // Update Features Grid
            ui.featuresGrid.innerHTML = '';
            if (data.currentFeatures && Object.keys(data.currentFeatures).length > 0) {
                // Loop through keys like "Precipitation (Pt)", "Soil Saturation (API)"
                for (const [key, value] of Object.entries(data.currentFeatures)) {
                    ui.featuresGrid.innerHTML += `
                        <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700 text-center">
                            <p class="text-xs text-slate-400 uppercase tracking-wide">${key}</p>
                            <p class="text-xl font-bold text-white mt-1">${value}</p>
                        </div>
                    `;
                }
            } else {
                ui.featuresGrid.innerHTML = '<div class="col-span-3 text-center text-slate-500 py-4">No input data available.</div>';
            }

            updateChart(data.historicalData || []);
        }

        function updateChart(historyData) {
            const ctx = ui.chartCanvas.getContext('2d');
            const labels = historyData.map(d => d.date);
            const actual = historyData.map(d => d.actual);
            const predicted = historyData.map(d => d.predicted);

            if (forecastChart) forecastChart.destroy();

            forecastChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Actual Water Level',
                            data: actual,
                            borderColor: '#3B82F6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            borderWidth: 2,
                            tension: 0.3,
                            fill: true
                        },
                        {
                            label: 'Predicted',
                            data: predicted,
                            borderColor: '#A855F7',
                            borderDash: [5, 5],
                            borderWidth: 2,
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { labels: { color: '#cbd5e1' } } },
                    scales: {
                        y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }

        ui.riverSelect.addEventListener('change', fetchRiverData);
        window.addEventListener('DOMContentLoaded', fetchRiverData);
    </script>
</body>
</html>
